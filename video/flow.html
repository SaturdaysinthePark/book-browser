<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BookJumpr — how are books connected?</title>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#f7f5f0;overflow:hidden;}canvas{display:block;}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// A BookJumpr film: a question, a wall of books, a path of real hops, the network, the logo. Every pixel is
// a function of time: seek(t) draws frame t from scratch (no transitions, timers or state between frames),
// so any frame can be rendered alone and the export is exact. ?film= picks the film (video/films/<film>.json,
// built into <film>.data.js), ?layout=stage|chain how the hops are shown, ?w=&h= the format (1920×1080 or
// 1080×1920), ?bpm= the tempo, ?play loops it in real time for previewing.
function main() {
  var F = window.FILM, Q = new URLSearchParams(location.search);
  var W = +Q.get('w') || 1920, H = +Q.get('h') || 1080, V = H > W;
  var LAYOUT = F.fans ? 'fan' : Q.get('layout') || F.layout || 'chain', CHAIN = LAYOUT === 'chain';   // chain (all hops on one screen) is the default
  var FAN = LAYOUT === 'fan', STG = !CHAIN && !FAN;                    // fan: one book and every book it mentions, then one of those fans out
  var NH = F.path.length - 1, HL = CHAIN ? 4.2 : 4.5;                 // hops, and beats per hop
  // fan timing: each fan's lines draw out one by one, then its quotes (each stays pinned), then the hop to the next fan's book
  var QL = V ? 4.4 : 3.6, HOPL = 5.2, HOP_LEAP = 3.8, HOP_OUT = 4.2, FT = FAN ? (function () {
    var t = 12, out = [];
    F.fans.forEach(function (f, i) {
      var ls = f.spokes.length > 8 ? 0.25 : f.spokes.length > 5 ? 0.3 : 0.45, q0 = t + f.spokes.length * ls + 0.5, nx = F.fans[i + 1];
      var slots = f.show.map(function (k, j) { return { k: k, s: q0 + j * QL }; }), end = q0 + slots.length * QL;
      out.push({ T: t, ls: ls, slots: slots, H: nx ? end : null });
      t = nx ? end + HOPL : end;
    });

  })() : null;
  var TN = FAN ? FT.O + 2.8 : 12 + NH * HL + (CHAIN ? 1.6 : 0);       // the network starts (chain: hold the whole chain to read it)
  var BPM = +Q.get('bpm') || 120, BEAT = 60 / BPM, BEATS = TN + 10, DUR = BEATS * BEAT;
  var cv = document.getElementById('c'), c = cv.getContext('2d'), CTX = c;
  // an offscreen layer, so a card made of several overlapping shapes can fade out as one image

  cv.width = W; cv.height = H; cv.style.width = W + 'px'; cv.style.height = H + 'px';

  var PAPER = '#f7f5f0', INK = '#141414', RUST = '#9c3d22', BLUE = '#2f5590', CARD = '#fdfcfa', CREAM = '#f3ecdc';
  var SERIF = "'Instrument Serif', serif", MONO = "'IBM Plex Mono', monospace", CABIN = "'Cabin', sans-serif";
  var PI = Math.PI;

  // ---------------------------------------------------------------- timing

  // ---------------------------------------------------------------- shapes

  // the BookJumpr mark (62×36 units): a dotted arc from (4,30) via (30,-8) to (58,23), a dot at its start

  };
  var markEnd = function (ox, oy, u) { return [ox + 57 * u, oy + 22 * u]; };

    c.restore();

  // a flat BookJumpr cover: genre band · cream title panel · genre band

    if (cur) lines.push(cur);
    return lines.slice(0, 3);
  };
  var cover = function (x, y, w, b, alpha, lift) {
    var h = w * 1.5;

    c.fillStyle = b.c; c.fillRect(x, y, w, h);
    c.fillStyle = CREAM; c.fillRect(x, y + h * 0.24, w, h * 0.52);
    c.beginPath(); c.ellipse(x + w / 2, y + h * 0.12, w * 0.15, h * 0.028, 0, 0, 2 * PI); c.fillStyle = CREAM; c.fill();
    c.beginPath(); var dx = x + w / 2, dy = y + h * 0.88, ds = w * 0.07; c.moveTo(dx, dy - ds); c.lineTo(dx + ds, dy); c.lineTo(dx, dy + ds); c.lineTo(dx - ds, dy); c.closePath(); c.fill();

    if (w >= 60) {

      c.fillStyle = INK; c.font = font; c.textAlign = 'center'; c.letterSpacing = '0.02em';
      lines.forEach(function (ln, i) { c.fillText(ln, x + w / 2, y + h * 0.5 + (i - (lines.length - 1) / 2) * fs * 1.2 + fs * 0.35); });
      c.letterSpacing = '0px';
    }
    c.lineWidth = Math.max(1.5, w * 0.014); c.strokeStyle = INK; c.strokeRect(x, y, w, h);
    c.restore();
  };

  // a cover drawn around its centre, with a tilt (wiggles) and a scale (pops)
  var coverC = function (x, y, w, b, alpha, rot, sc) {
    if ((sc == null ? 1 : sc) <= 0.002 || alpha <= 0.002) return;
    c.save(); c.translate(x, y); c.rotate(rot || 0); c.scale(sc == null ? 1 : sc, sc == null ? 1 : sc);
    cover(-w / 2, -w * 0.75, w, b, alpha); c.restore();
  };
  // the little book's landing: a quick squash that springs back (closed form), and a stretch in the air
  var squash = function (b, tl) {
    var x = (b - tl) * BEAT;
    if (x < 0 || x > 0.45) return [1, 1];

    return [1 + s * 0.7, 1 - s];
  };
  var stretch = function (p) { var s = 0.14 * Math.sin(PI * p); return [1 - s * 0.5, 1 + s]; };

  var hop = function (A, B, b, b0, b1, h, C) {
    var p = eio(b, b0, b1); C = C || [(A[0] + B[0]) / 2, Math.min(A[1], B[1]) - h]; var P = q(A, C, B, p);

  };

  // ---------------------------------------------------------------- layout
  var cx = W / 2, cy = H / 2;
  var PATH = F.path, HOPS = F.hops;

  // 1 · the question, laid out word by word
  var QS = (function () {
    var fs = V ? 112 : 124, maxW = V ? 900 : 1500, all = F.question.split(' '), lines = null;
    var fontOf = function (w) { return (w === F.accent ? 'italic ' : '') + fs + 'px ' + SERIF; };
    var width = function (ws) { return ws.reduce(function (a, w) { return a + tw(w, fontOf(w)); }, 0) + tw(' ', fs + 'px ' + SERIF) * (ws.length - 1); };

    lines.forEach(function (ln, li) {
      var hot = function (w) { return w === F.accent; };
      var fonts = ln.map(function (w) { return (hot(w) ? 'italic ' : '') + fs + 'px ' + SERIF; });
      var sp = tw(' ', fs + 'px ' + SERIF), wsum = ln.reduce(function (a, w, i) { return a + tw(w, fonts[i]); }, 0) + sp * (ln.length - 1), x = cx - wsum / 2;
      ln.forEach(function (w, i) { var ww = tw(w, fonts[i]); words.push({ s: w, x: x, y: y0 + li * lh, w: ww, font: fonts[i], hot: hot(w), k: k, tilt: ((k * 37) % 11 - 5) * 0.022 }); x += ww + sp; k++; });
    });

    return { fs: fs, words: words };
  })();
  var wordTop = function (w) { return [w.x + w.w * (w.hot ? 0.93 : 0.5), w.y - QS.fs * 0.78]; };

  // 2 · the big view: a wall of covers, rippling in from the middle and drifting
  var WALL = (function () {
    var cw = V ? 190 : 92, ch = cw * 1.5, gx = V ? 34 : 22, gy = V ? 44 : 30, cols = Math.ceil(W / (cw + gx)) + 3, rows = Math.ceil(H / (ch + gy)) + 3;
    var x0 = cx - (cols - 1) * (cw + gx) / 2, y0 = cy - (rows - 1) * (ch + gy) / 2, list = [], n = 0;
    var jc = Math.floor(cols / 2) + (V ? 1 : 2), jr = Math.floor(rows / 2) - (V ? 1 : 0);
    for (var col = 0; col < cols; col++) for (var row = 0; row < rows; row++) {
      var isJ = col === jc && row === jr, b = isJ ? PATH[0] : F.wall[(n++ * 11) % F.wall.length];
      var x = x0 + col * (cw + gx), y = y0 + row * (ch + gy) + (col % 2 ? ch * 0.3 : 0);

    }

    var near = list.filter(function (e) { return !e.j && e.d < (V ? 760 : 600) && e.d > (V ? 200 : 140); }).sort(function (a, z) { return a.d - z.d; });

  })();
  var drift = function (b) { return [-(b - 6) * (V ? 10 : 14), -(b - 6) * 4]; };   // the wall drifts slowly while we look

  // 3 · the hops: the path's books stand along a line, the camera moves along it
  var CW = V ? 320 : 300, D = V ? 900 : 1180;
  var bookAt = function (k) { return V ? [0, k * D] : [k * D, 0]; };                   // world positions
  var STAGE = V ? [cx, cy - D / 2] : [cx - D / 2, cy + 40];                              // where the current book sits on screen
  var hopStart = function (k) { return 12 + k * HL; };
  // camera: screen = world − cam + stage. Between hops it centres the gap between the two books
  var camAt = function (b) {

  };

  var aimAt = function (x, y, w, Cx, Cy) { return [clamp(Cx, x - w / 2 - 12, x + w / 2 + 12), clamp(Cy, y - w * 0.75 - 12, y + w * 0.75 + 12)]; };
