<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BookJumpr — how are books connected?</title>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#f7f5f0;overflow:hidden;}canvas{display:block;}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="film-data.js"></script>
<script>
// "Have you ever wondered how books are connected?" — a 20-second BookJumpr film. Every pixel is a
// function of time: seek(t) draws frame t from scratch (no transitions, timers or state between frames),
// so any frame can be rendered alone and the export is exact. ?w=&h= picks the format (1920×1080 or
// 1080×1920), ?bpm= the tempo, ?play loops it in real time for previewing.
function main() {
  var F = window.FILM, Q = new URLSearchParams(location.search);
  var W = +Q.get('w') || 1920, H = +Q.get('h') || 1080, V = H > W;
  var BPM = +Q.get('bpm') || 120, BEAT = 60 / BPM, BEATS = 40, DUR = BEATS * BEAT;
  var cv = document.getElementById('c'), c = cv.getContext('2d');
  cv.width = W; cv.height = H; cv.style.width = W + 'px'; cv.style.height = H + 'px';

  var PAPER = '#f7f5f0', INK = '#141414', RUST = '#9c3d22', BLUE = '#2f5590', CARD = '#fdfcfa', CREAM = '#f3ecdc';
  var SERIF = "'Instrument Serif', serif", MONO = "'IBM Plex Mono', monospace", CABIN = "'Cabin', sans-serif";
  var PI = Math.PI;

  // ---------------------------------------------------------------- timing
  var clamp = function (x, a, b) { return x < a ? a : x > b ? b : x; };
  var lerp = function (a, b, t) { return a + (b - a) * t; };
  var prog = function (b, b0, b1) { return clamp((b - b0) / (b1 - b0), 0, 1); };
  var eio = function (b, b0, b1) { var x = prog(b, b0, b1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  var eout = function (b, b0, b1) { var x = prog(b, b0, b1); return 1 - Math.pow(1 - x, 3); };
  var ein = function (b, b0, b1) { var x = prog(b, b0, b1); return x * x * x; };
  // one closed-form spring for every settle (damped oscillator, ~10% overshoot), blended to exactly 1 at
  // the end of its window so nothing is still wobbling when a loop or scene boundary arrives
  var spr = function (b, b0, len) {
    len = len || 1.4;
    var x = (b - b0) * BEAT, D = len * BEAT;
    if (x <= 0) return 0;
    if (x >= D) return 1;
    var z = 0.52, w0 = 2 * PI * 2.3, wd = w0 * Math.sqrt(1 - z * z);
    var v = 1 - Math.exp(-z * w0 * x) * (Math.cos(wd * x) + (z * w0 / wd) * Math.sin(wd * x));
    var k = clamp((x - 0.72 * D) / (0.28 * D), 0, 1); k = k * k * (3 - 2 * k);
    return v * (1 - k) + k;
  };
  var mix = function (h1, h2, t) {
    var a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
    var r = Math.round(lerp(a >> 16, b >> 16, t)), g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, t)), bl = Math.round(lerp(a & 255, b & 255, t));
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  };

  // ---------------------------------------------------------------- shapes
  var rr = function (x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.roundRect(x, y, w, h, r); };
  var q = function (p0, p1, p2, t) { var a = 1 - t; return [a * a * p0[0] + 2 * a * t * p1[0] + t * t * p2[0], a * a * p0[1] + 2 * a * t * p1[1] + t * t * p2[1]]; };
  var cub = function (p0, p1, p2, p3, t) { var a = 1 - t; return [a * a * a * p0[0] + 3 * a * a * t * p1[0] + 3 * a * t * t * p2[0] + t * t * t * p3[0], a * a * a * p0[1] + 3 * a * a * t * p1[1] + 3 * a * t * t * p2[1] + t * t * t * p3[1]]; };
  // a dashed curve drawn on up to `upto` (0..1), its dashes travelling along it (`flow` in px)
  var dashed = function (pt, upto, col, lw, dash, gap, flow, alpha) {
    if (upto <= 0) return;
    var n = 48, m = Math.max(1, Math.round(n * upto));
    c.beginPath();
    for (var i = 0; i <= m; i++) { var p = pt(i / n * (upto * n / m) * (m / n) * (n / m)); if (i) c.lineTo(p[0], p[1]); else c.moveTo(p[0], p[1]); }
    c.setLineDash([dash, gap]); c.lineDashOffset = -flow; c.lineWidth = lw; c.strokeStyle = col; c.globalAlpha = alpha == null ? 1 : alpha; c.lineCap = 'butt';
    c.stroke(); c.setLineDash([]); c.globalAlpha = 1;
  };
  var text = function (s, x, y, font, col, align, alpha, ls) {
    c.font = font; c.fillStyle = col; c.textAlign = align || 'left'; c.textBaseline = 'alphabetic'; c.globalAlpha = alpha == null ? 1 : alpha;
    c.letterSpacing = ls || '0px'; c.fillText(s, x, y); c.letterSpacing = '0px'; c.globalAlpha = 1;
  };
  var tw = function (s, font, ls) { c.font = font; c.letterSpacing = ls || '0px'; var w = c.measureText(s).width; c.letterSpacing = '0px'; return w; };

  // the BookJumpr mark (62×36 units): a dotted arc from (4,30) via (30,-8) to (58,23), a dot at its start
  var ARC = [[4, 30], [30, -8], [58, 23]];
  var mark = function (ox, oy, u, upto, dot, alpha) {
    var P = function (t) { var p = q(ARC[0], ARC[1], ARC[2], t); return [ox + p[0] * u, oy + p[1] * u]; };
    dashed(P, upto == null ? 1 : upto, INK, 2 * u, 3 * u, 3.4 * u, 0, alpha);
    if (dot !== 0) { c.globalAlpha = (alpha == null ? 1 : alpha) * (dot == null ? 1 : dot); c.beginPath(); c.arc(ox + 4 * u, oy + 30 * u, 2.4 * u, 0, 2 * PI); c.fillStyle = INK; c.fill(); c.globalAlpha = 1; }
  };
  var markEnd = function (ox, oy, u) { return [ox + 57 * u, oy + 22 * u]; };
  // the little rust book (the logo's), the film's one travelling character
  var book = function (x, y, u, rot, alpha, sx, sy) {
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(sx || 1, sy || 1); c.globalAlpha = alpha == null ? 1 : alpha;
    c.beginPath(); c.rect(-4 * u, -5.8 * u, 8 * u, 11.6 * u); c.fillStyle = RUST; c.fill();
    c.lineWidth = 1.9 * u; c.strokeStyle = INK; c.stroke();
    c.beginPath(); c.moveTo(-1.7 * u, -5.8 * u); c.lineTo(-1.7 * u, 5.8 * u); c.lineWidth = 1.5 * u; c.strokeStyle = INK; c.stroke();
    c.restore();
  };
  var BOOKROT = 38 * PI / 180;

  // a flat BookJumpr cover: genre band · cream title panel · genre band
  var wrapLines = function (s, font, maxW, ls) {
    var words = s.toUpperCase().split(' '), lines = [], cur = '';
    words.forEach(function (w) { var t = cur ? cur + ' ' + w : w; if (tw(t, font, ls) > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
    if (cur) lines.push(cur);
    return lines.slice(0, 3);
  };
  var cover = function (x, y, w, b, alpha, lift) {
    var h = w * 1.5;
    c.save(); c.globalAlpha = alpha == null ? 1 : alpha;
    c.fillStyle = 'rgba(20,20,20,0.13)'; c.fillRect(x + w * 0.05 + (lift || 0) * 6, y + w * 0.05 + (lift || 0) * 6, w, h);
    c.fillStyle = b.c; c.fillRect(x, y, w, h);
    c.fillStyle = CREAM; c.fillRect(x, y + h * 0.24, w, h * 0.52);
    c.beginPath(); c.ellipse(x + w / 2, y + h * 0.12, w * 0.15, h * 0.028, 0, 0, 2 * PI); c.fillStyle = CREAM; c.fill();
    c.beginPath(); var dx = x + w / 2, dy = y + h * 0.88, ds = w * 0.07; c.moveTo(dx, dy - ds); c.lineTo(dx + ds, dy); c.lineTo(dx, dy + ds); c.lineTo(dx - ds, dy); c.closePath(); c.fill();
    var fs = Math.max(7, w * 0.085), font = '700 ' + fs + 'px ' + CABIN, lines = wrapLines(b.t, font, w * 0.82, '0.02em');
    c.fillStyle = INK; c.font = font; c.textAlign = 'center'; c.letterSpacing = '0.02em';
    lines.forEach(function (ln, i) { c.fillText(ln, x + w / 2, y + h * 0.5 + (i - (lines.length - 1) / 2) * fs * 1.2 + fs * 0.35); });
    c.letterSpacing = '0px';
    c.lineWidth = Math.max(1.5, w * 0.014); c.strokeStyle = INK; c.strokeRect(x, y, w, h);
    c.restore();
  };

  // a cover drawn around its centre, with a tilt (wiggles) and a scale (pops)
  var coverC = function (x, y, w, b, alpha, rot, sc) {
    if ((sc == null ? 1 : sc) <= 0.002 || alpha <= 0.002) return;
    c.save(); c.translate(x, y); c.rotate(rot || 0); c.scale(sc == null ? 1 : sc, sc == null ? 1 : sc);
    cover(-w / 2, -w * 0.75, w, b, alpha); c.restore();
  };
  // the little book's landing: a quick squash that springs back (closed form), and a stretch in the air
  var squash = function (b, tl) {
    var x = (b - tl) * BEAT;
    if (x < 0 || x > 0.45) return [1, 1];
    var s = 0.28 * Math.exp(-9 * x) * Math.cos(26 * x);
    return [1 + s * 0.7, 1 - s];
  };
  var stretch = function (p) { var s = 0.14 * Math.sin(PI * p); return [1 - s * 0.5, 1 + s]; };
  // a hop from A to B between beats b0 and b1 (arc height h): position, rotation, scale
  var hop = function (A, B, b, b0, b1, h, C) {
    var p = eio(b, b0, b1); C = C || [(A[0] + B[0]) / 2, Math.min(A[1], B[1]) - h]; var P = q(A, C, B, p);
    var st = b < b1 ? stretch(p) : squash(b, b1);
    return { p: P, sx: st[0], sy: st[1], t: p };
  };

  // ---------------------------------------------------------------- layout
  var cx = W / 2, cy = H / 2;
  var PATH = F.path, HOPS = F.hops;

  // 1 · the question, laid out word by word
  var QS = (function () {
    var fs = V ? 112 : 124, lines = V ? [['Have', 'you', 'ever'], ['wondered', 'how'], ['books', 'are'], ['connected?']] : [['Have', 'you', 'ever', 'wondered'], ['how', 'books', 'are', 'connected?']];
    var lh = fs * 1.12, y0 = cy - (lines.length - 1) * lh / 2 + fs * 0.32, words = [], k = 0;
    lines.forEach(function (ln, li) {
      var hot = function (w) { return w === 'connected?'; };
      var fonts = ln.map(function (w) { return (hot(w) ? 'italic ' : '') + fs + 'px ' + SERIF; });
      var sp = tw(' ', fs + 'px ' + SERIF), wsum = ln.reduce(function (a, w, i) { return a + tw(w, fonts[i]); }, 0) + sp * (ln.length - 1), x = cx - wsum / 2;
      ln.forEach(function (w, i) { var ww = tw(w, fonts[i]); words.push({ s: w, x: x, y: y0 + li * lh, w: ww, font: fonts[i], hot: hot(w), k: k, tilt: ((k * 37) % 11 - 5) * 0.022 }); x += ww + sp; k++; });
    });
    words.forEach(function (w) { w.pop = 0.5 + w.k * 0.55; });
    return { fs: fs, words: words };
  })();
  var wordTop = function (w) { return [w.x + w.w * (w.hot ? 0.93 : 0.5), w.y - QS.fs * 0.78]; };

  // 2 · the big view: a wall of covers, rippling in from the middle and drifting
  var WALL = (function () {
    var cw = V ? 104 : 92, ch = cw * 1.5, gx = V ? 26 : 22, gy = 30, cols = Math.ceil(W / (cw + gx)) + 3, rows = Math.ceil(H / (ch + gy)) + 3;
    var x0 = cx - (cols - 1) * (cw + gx) / 2, y0 = cy - (rows - 1) * (ch + gy) / 2, list = [], n = 0;
    var jc = Math.floor(cols / 2) + (V ? 1 : 2), jr = Math.floor(rows / 2) - (V ? 1 : 0);
    for (var col = 0; col < cols; col++) for (var row = 0; row < rows; row++) {
      var isJ = col === jc && row === jr, b = isJ ? PATH[0] : F.wall[(n++ * 11) % F.wall.length];
      var x = x0 + col * (cw + gx), y = y0 + row * (ch + gy) + (col % 2 ? ch * 0.3 : 0);
      list.push({ b: b, x: x, y: y, j: isJ, d: Math.hypot(x - cx, y - cy), wig: (col * 7 + row * 13) % 9 === 0 });
    }
    var je = list.filter(function (e) { return e.j; })[0];
    // the covers the book browses on the way (near the middle, on the beat)
    var near = list.filter(function (e) { return !e.j && e.d < (V ? 520 : 600) && e.d > 140; }).sort(function (a, z) { return a.d - z.d; });
    var browse = [near[3], near[9], near[1]];
    return { cw: cw, ch: ch, list: list, je: je, browse: browse };
  })();
  var drift = function (b) { return [-(b - 6) * (V ? 10 : 14), -(b - 6) * 4]; };   // the wall drifts slowly while we look

  // 3 · the hops: the path's books stand along a line, the camera moves along it
  var CW = V ? 320 : 300, D = V ? 900 : 1180;
  var bookAt = function (k) { return V ? [0, k * D] : [k * D, 0]; };                   // world positions
  var STAGE = V ? [cx, cy - D / 2] : [cx - D / 2, cy + 40];                              // where the current book sits on screen
  var hopStart = function (k) { return 12 + k * 4.5; };
  // camera: screen = world − cam + stage. Between hops it centres the gap between the two books
  var camAt = function (b) {
    var k = clamp(Math.floor((b - 12) / 4.5), 0, 3), s = hopStart(k), t = k + eio(b, s + 3.7, s + 4.6);
    if (b >= hopStart(3) + 3.7) t = 3 + eio(b, hopStart(3) + 3.7, hopStart(3) + 4.6);   // the last one: Gatsby to the middle
    var w = V ? [0, t * D] : [t * D, 0];
    return w;
  };
  var toScreen = function (P, cam, b) {
    var last = eio(b, hopStart(3) + 3.7, hopStart(3) + 4.6);                            // at the end, Gatsby sits dead centre
    var st = [lerp(STAGE[0], V ? cx : cx, last), lerp(STAGE[1], cy, last)];
    var mid = V ? [0, D / 2] : [D / 2, 0];
    return [P[0] - cam[0] + st[0] + (V ? 0 : mid[0] * (1 - last) * 0) , P[1] - cam[1] + st[1]];
  };

  // the quote bubbles: words laid out once, the named title found in the words
  var norm = function (s) { return s.toLowerCase().replace(/[^a-z]/g, ''); };
  var BUB = HOPS.map(function (hp) {
    var raw = hp.quote.trim().replace(/^"(.*)"$/, '$1').replace(/(^|[\s(])'/g, '$1‘').replace(/'/g, '’').replace(/"([^"]*)"/g, '“$1”');
    var qs = '“' + raw + '”', fs = V ? 46 : 46, font = fs + 'px ' + SERIF, maxW = V ? 840 : 740;
    var words = qs.split(' '), lines = [[]], lw = 0, spc = tw(' ', font);
    words.forEach(function (w) { var ww = tw(w, font); if (lw + ww > maxW && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push({ s: w, w: ww }); lw += ww + spc; });
    var head = 96, lh = fs * 1.2, padX = 40, h = head + lines.length * lh + 26, w = Math.max(maxW, Math.max.apply(null, lines.map(function (ln) { return ln.reduce(function (a, x) { return a + x.w + spc; }, -spc); }))) + padX * 2;
    var list = [], k = 0;
    lines.forEach(function (ln, li) { var xx = padX; ln.forEach(function (wd) { list.push({ s: wd.s, x: xx, y: head + li * lh + fs * 0.82, w: wd.w, k: k++ }); xx += wd.w + spc; }); });
    // the run of words that spells the named book (case, hyphens and punctuation don't matter)
    var target = norm(PATH[hp.named].t), hl = [];
    for (var i = 0; i < list.length && !hl.length; i++) { var acc = ''; for (var j = i; j < list.length && acc.length < target.length; j++) { acc += norm(list[j].s); if (acc === target) hl = list.slice(i, j + 1); } }
    if (!hl.length) throw new Error('title not found in quote: ' + PATH[hp.named].t);
    return { hp: hp, w: w, h: h, fs: fs, font: font, words: list, hl: hl };
  });

  // 4 · the network: the path's books at their real places on the site's map
  var ST = F.stars, NST = ST.x.length, P = F.torus.P, PY = F.torus.PY;
  var wrapd = function (d, p) { return d - p * Math.round(d / p); };
  var NET = (function () {
    var s0 = PATH[0].star, pts = PATH.map(function (b) { return [ST.x[s0] + wrapd(ST.x[b.star] - ST.x[s0], P), ST.y[s0] + wrapd(ST.y[b.star] - ST.y[s0], PY)]; });
    var mx = pts.reduce(function (a, p) { return a + p[0]; }, 0) / pts.length, my = pts.reduce(function (a, p) { return a + p[1]; }, 0) / pts.length;
    var spanX = Math.max.apply(null, pts.map(function (p) { return Math.abs(p[0] - mx); })), spanY = Math.max.apply(null, pts.map(function (p) { return Math.abs(p[1] - my); }));
    var kp = Math.min((W * 0.36) / Math.max(40, spanX), (H * 0.34) / Math.max(40, spanY), 3.2);
    return { c: [mx, my], pts: pts, kp: kp, k1: Math.max(W / P, H / PY) * 1.08 };
  })();

  // 5 · the end card: mark + wordmark, and the address
  var LOCK = (function () {
    var u = V ? 3.6 : 4.4, fs = V ? 136 : 168, gap = V ? 26 : 36, wm = tw('BookJumpr', fs + 'px ' + SERIF);
    var w = 62 * u + gap + wm, x = cx - w / 2, y = cy + fs * 0.05;
    return { u: u, fs: fs, x: x, y: y, mx: x, my: y - 22 * u - fs * 0.12, wx: x + 62 * u + gap, wy: y + fs * 0.24, w: w };
  })();
  var ARCPTS = (function () { var pts = [], n = 64; for (var i = 0; i < n; i++) { var p = q(ARC[0], ARC[1], ARC[2], (i + 0.5) / n); pts.push([LOCK.mx + p[0] * LOCK.u, LOCK.my + p[1] * LOCK.u]); } return pts; })();
  var BIG = []; for (var i0 = 0; i0 < NST; i0++) if (ST.d[i0] >= 4) BIG.push(i0);

  // where a path book's top edge is (the little book perches there, a little right of centre)
  var bu = function (w) { return Math.max(2.2, w * 0.02); };                            // the book's size on a cover of width w
  var perch = function (x, y, w) { return [x + w * 0.22, y - w * 0.75 - 5.2 * bu(w)]; };

  // ---------------------------------------------------------------- the film
  var draw = function (b) {
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1;
    c.fillStyle = PAPER; c.fillRect(0, 0, W, H);
    var bk = null;   // the little book this frame: {p, u, rot, sx, sy}

    // ===== 1 · the question (b0–6.6) =====
    if (b < 6.8) {
      var gone = function (w) { return ein(b, 6.0 + w.k * 0.05, 6.5 + w.k * 0.05); };   // words shrink away as the wall arrives
      QS.words.forEach(function (w) {
        var s = spr(b, w.pop, 1.5), g = gone(w); if (s <= 0) return;
        var wob = w.tilt * (1 - spr(b, w.pop, 2.2)), sc = (0.6 + 0.4 * s) * (1 - g);
        c.save(); c.translate(w.x + w.w / 2, w.y - QS.fs * 0.3); c.rotate(wob + g * w.tilt * 4); c.scale(sc, sc);
        text(w.s, -w.w / 2, QS.fs * 0.3 + (1 - s) * 30, w.font, w.hot ? RUST : INK, 'left', clamp(s * 1.5, 0, 1));
        c.restore();
      });
      // the book: drops in, then hops word to word, landing on each as it pops (on the "?" at the end)
      var ws = QS.words, cur = 0;
      for (var i = 0; i < ws.length; i++) if (b >= ws[i].pop - 0.42) cur = i;
      var A = cur === 0 ? [wordTop(ws[0])[0], -80] : wordTop(ws[cur - 1]), B = wordTop(ws[cur]);
      var hp = hop(A, B, b, ws[cur].pop - 0.42, ws[cur].pop, cur === 0 ? 0 : 70);
      var lastLand = ws[ws.length - 1].pop;
      var sq = b > lastLand + 0.4 ? squash(b, 5.0) : [hp.sx, hp.sy];                      // a little jump of joy on beat 5
      var joy = b > 4.6 && b < 5.0 ? Math.sin(PI * prog(b, 4.6, 5.0)) * 34 : 0;
      bk = { p: [hp.p[0], hp.p[1] - joy], u: V ? 4.4 : 4.8, rot: BOOKROT * 0.6, sx: sq[0], sy: sq[1] };
    }

    // ===== 2 · the big view, the tap, the zoom (b6–12.4) =====
    var Z = CW / WALL.cw, zt = eio(b, 10.4, 12.0);          // zoom into Jane Eyre
    var je = WALL.je, dr = drift(Math.min(b, 10.4));
    var jeS0 = [je.x + dr[0], je.y + dr[1]];                 // Jane Eyre on screen before the zoom
    var jeS1 = toScreen(bookAt(0), camAt(12), 12);           // …and where the hop stage wants it
    var zoomPt = function (x, y) { var z = lerp(1, Z, zt); return [lerp(jeS0[0], jeS1[0], zt) + (x - jeS0[0]) * z, lerp(jeS0[1], jeS1[1], zt) + (y - jeS0[1]) * z]; };
    if (b >= 6 && b < 12.4) {
      var zs = lerp(1, Z, zt), fadeOthers = 1 - eio(b, 10.8, 11.9);
      WALL.list.forEach(function (e) {
        var pop = spr(b, 6.1 + e.d / (V ? 1100 : 1300), 1.4); if (pop <= 0) return;
        var d = drift(Math.min(b, 10.4)), sp = zoomPt(e.x + d[0], e.y + d[1]);
        if (e.j) return;
        var wig = e.wig ? Math.sin((b - 6) * PI * 2) * 0.09 * Math.exp(-((b - 6) % 1) * 3) * (b > 6.8 && b < 9.6 ? 1 : 0) : 0;
        if (sp[0] < -200 || sp[0] > W + 200 || sp[1] < -260 || sp[1] > H + 260) return;
        coverC(sp[0], sp[1], WALL.cw * zs, e.b, fadeOthers, wig, pop);
      });
      // the cursor taps Jane Eyre
      if (b >= 8.4 && b < 11.2) {
        var cin = eio(b, 8.4, 9.7), cout = ein(b, 10.3, 11.1), tgt = [jeS0[0] + WALL.cw * 0.18, jeS0[1] + WALL.ch * 0.12];
        var c0 = [W + 60, H * 0.92], cp = q(c0, [lerp(c0[0], tgt[0], 0.5), tgt[1] + 240], tgt, cin);
        cp = [lerp(cp[0], W + 90, cout), lerp(cp[1], H + 90, cout)];
        var csc = (V ? 2.3 : 2.0) * (b >= 9.85 && b < 10.1 ? 0.82 : 1);
        c.save(); c.translate(cp[0], cp[1]); c.scale(csc, csc);
        c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 22); c.lineTo(5.5, 16.8); c.lineTo(9.6, 25.6); c.lineTo(13.2, 24); c.lineTo(9.2, 15.4); c.lineTo(16.6, 15.4); c.closePath();
        c.fillStyle = INK; c.fill(); c.lineWidth = 1.6; c.strokeStyle = '#fff'; c.lineJoin = 'round'; c.stroke(); c.restore();
      }
    }

    // ===== 3 · the path: Jane Eyre and the books it leads to (b6–31) =====
    var cam = camAt(b), trailIn = function (k) { return eio(b, hopStart(k) + 3.7, hopStart(k) + 4.4); };
    var TR = { x: V ? 70 : 64, y: V ? H - 190 : H - 118, w: V ? 50 : 44, gap: V ? 96 : 86 };   // the trail of jumps, bottom-left
    var trailAt = function (k) { return [TR.x + k * TR.gap + TR.w / 2, TR.y + TR.w * 0.75]; };
    var toNet = eio(b, 30.0, 31.2);                                  // trail covers → dots on the map
    var netK = Math.exp(lerp(Math.log(NET.kp), Math.log(NET.k1), eio(b, 31.4, 34.0)));
    var netPt = function (k) { var p = NET.pts[k]; return [cx + (p[0] - NET.c[0]) * netK, cy + (p[1] - NET.c[1]) * netK]; };
    var pathPos = [];                                                // each path book's screen position + width this frame
    if (b >= 6 && b < 35) {
      for (var k = 0; k < PATH.length; k++) {
        var pop = k === 0 ? spr(b, 6.1 + je.d / (V ? 1100 : 1300), 1.4) : spr(b, hopStart(k - 1) + 0.2, 1.6);
        if (pop <= 0) { pathPos.push(null); continue; }
        var onStage = toScreen(bookAt(k), cam, b), w = CW;
        if (k === 0 && b < 12.4) { onStage = zoomPt(jeS0[0], jeS0[1]); w = WALL.cw * lerp(1, Z, zt); if (b >= 9.9 && b < 10.6) w *= 1 + 0.08 * spr(b, 9.9, 1.0) * (1 - prog(b, 10.2, 10.6)); }

          var np = netPt(k), dx = lerp(x, np[0], toNet), dy = lerp(y, np[1], toNet), dw = lerp(ww, 0, toNet);
          if (dw > 2) coverC(dx, dy, dw, PATH[k], 1, 0, 1);
          var dr2 = lerp(0, V ? 15 : 13, toNet);
          c.beginPath(); c.arc(dx, dy, dr2, 0, 2 * PI); c.fillStyle = PATH[k].c; c.globalAlpha = toNet; c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.stroke(); c.globalAlpha = 1;

      }

          var a0 = trailAt(k2), a1 = trailAt(k2 + 1), y1 = TR.y + TR.w * 0.2;
          dashed(function (t) { return q([a0[0] + TR.w * 0.3, y1], [(a0[0] + a1[0]) / 2, y1 - 26], [a1[0] - TR.w * 0.3, y1], t); }, on, INK, 2, 4, 4, 0, 1);
        }
      }
    }

    // the quote bubbles + highlighter + the jump, once per hop
    for (var h = 0; h < 4; h++) {
      var s0 = hopStart(h), Bq = BUB[h];

      var cur2 = toScreen(bookAt(h), cam, b), nxt = toScreen(bookAt(h + 1), cam, b), src = Bq.hp.src === h ? cur2 : nxt;

      var gIn = spr(b, s0 + 0.7, 1.6), gOut = V ? ein(b, s0 + 2.65, s0 + 3.1) : ein(b, s0 + 3.7, s0 + 4.3), g = gIn * (1 - gOut);

        var bx = V ? cx : (cur2[0] + nxt[0]) / 2, by = V ? (cur2[1] + nxt[1]) / 2 : cy + 20;

        var base = V ? [[ox - 26 * g, ty], [ox + 26 * g, ty]] : [[tx, ty - 26 * g], [tx, ty + 26 * g]];

        c.beginPath(); c.moveTo(base[0][0], base[0][1]); c.lineTo(tip[0], tip[1]); c.lineTo(base[1][0], base[1][1]); c.strokeStyle = INK; c.lineWidth = 3; c.stroke();
        c.restore();

          var ca = clamp((g - 0.85) / 0.15, 0, 1), sb = PATH[Bq.hp.src];

          text(sb.t, x0 + 98, y0 + 46, (V ? 34 : 32) + 'px ' + SERIF, INK, 'left', ca);
          text(sb.a.toUpperCase(), x0 + 100, y0 + 76, '500 ' + (V ? 17 : 16) + 'px ' + MONO, 'rgba(20,20,20,0.6)', 'left', ca, '0.14em');
          var hl = eio(b, s0 + 2.0, s0 + 2.6), a0w = Bq.hl[0], z0w = Bq.hl[Bq.hl.length - 1];
          // the named book, swiped with a rust highlighter (behind its words)
          if (hl > 0) {
            var lines2 = {}; Bq.hl.forEach(function (wd) { (lines2[wd.y] = lines2[wd.y] || []).push(wd); });
            var tot = Bq.hl.reduce(function (a, wd) { return a + wd.w; }, 0), done = hl * tot;
            Object.keys(lines2).forEach(function (ky) { var ln = lines2[ky], lx = ln[0].x, rx = ln[ln.length - 1].x + ln[ln.length - 1].w, lw = Math.min(rx - lx, Math.max(0, done)); done -= rx - lx;

            text(wd.s, x0 + wd.x, y0 + wd.y + (1 - wa) * 10, Bq.font, isH && hl > 0 ? mix(INK, RUST, hl) : INK, 'left', wa);

    // ===== 4 · the network (b30–35.5) =====
    if (b >= 30.6) {
      var sa = eio(b, 31.0, 32.6), gath = b >= 34.4;
      var camN = [NET.c[0], NET.c[1]];
      var sx = function (i) { return cx + wrapd(ST.x[i] - camN[0], P) * netK; }, sy = function (i) { return cy + wrapd(ST.y[i] - camN[1], PY) * netK; };
      var rad = function (i) { return (0.9 + Math.sqrt(ST.d[i]) * 0.42) * clamp(Math.sqrt(netK) * 1.1, 0.95, 4); };

      if (pa > 0) for (var k3 = 0; k3 < 4; k3++) {
        var p0 = netPt(k3), p1 = netPt(k3 + 1), cpt = [(p0[0] + p1[0]) / 2, Math.min(p0[1], p1[1]) - 40 - 0.12 * Math.abs(p1[0] - p0[0])];
        dashed(function (t) { return q(p0, cpt, p1, t); }, clamp(pa * 4 - k3, 0, 1), RUST, 3.2, 9, 7, b * BEAT * 40, 1);

          c.globalAlpha = 0.9 * gA; c.beginPath(); c.arc(lerp(sx(bi), tgt2[0], g2), lerp(sy(bi), tgt2[1], g2), lerp(rad(bi), LOCK.u, g2), 0, 2 * PI);

    }

    // ===== 5 · the end card (b35.9–40) =====
    if (b >= 35.9) {

      var font = LOCK.fs + 'px ' + SERIF, x4 = LOCK.wx, s4 = 'BookJumpr';
      for (var j = 0; j < s4.length; j++) { var la = spr(b, 36.3 + j * 0.08, 1.4); text(s4[j], x4, LOCK.wy + (1 - la) * LOCK.fs * 0.45, font, INK, 'left', clamp(la * 1.6, 0, 1)); x4 += tw(s4[j], font); }
      var ua = spr(b, 37.4, 1.5);

    }

    // ===== the little book's journey, scene by scene =====

      var qmark = wordTop(QS.words[QS.words.length - 1]);
      var seq = [qmark].concat(stops).concat([jeP]), times = [6.3, 7.0, 8.0, 9.0, 10.3];

      bk = { p: hb.p, u: b >= 10.15 && pathPos[0] ? bu(pathPos[0][2]) : lerp(V ? 4.4 : 4.8, bu(WALL.cw), eio(b, 6.3, 7.0)), rot: BOOKROT * 0.6, sx: hb.sx, sy: hb.sy };

        var Cj = V ? [Math.max(A2[0], B2[0]) + CW * 1.1, (A2[1] + B2[1]) / 2 - CW * 0.5] : [(A2[0] + B2[0]) / 2, Math.min(A2[1], B2[1]) - 300];

    }

  else window.seek(+Q.get('t') || 0);
}

]).then(function () { return document.fonts.ready; }).then(main);
