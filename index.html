<style>
:root{--paper:#f7f5f0;--ink:#141414;--accent:#9c3d22;--card:#fdfcfa;--mut:rgba(20,20,20,.55);--inbound:#2f5590;
  /* motion tokens — one vocabulary for every transition on the site */
  --ease-out:cubic-bezier(.2,.7,.2,1);--ease-in-out:cubic-bezier(.65,0,.35,1);
  --ease-spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1);
  --dur-1:120ms;--dur-2:240ms;--dur-3:480ms;
  --cream:#f2ecdd;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
a{color:var(--ink);}
a:hover{color:var(--accent);}
::selection{background:var(--ink);color:var(--paper);}
input:focus{outline:none;}
/* text inputs: a quiet ink ring on focus (clicking into a field still matches :focus-visible) */
input:focus-visible{outline:none;box-shadow:0 4px 0 rgba(20,20,20,.9),0 0 0 4px rgba(20,20,20,.14) !important;}
/* ---------- Penguin tri-band cover (rendered by P.coverHTML in app.js) ----------
   Everything is sized in cqi against .cv, so one component scales from thumbnail to hero.
   --lit (0..1) mixes the band from ink to the genre colour; registered so it can transition. */
@property --lit{syntax:'<number>';inherits:true;initial-value:1;}
.cv-host{display:block;}
.cv{container-type:inline-size;position:relative;aspect-ratio:2/3;width:100%;transition:--lit .35s ease;}
.cv-in{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;text-align:center;
  --band:color-mix(in oklab,var(--bandc,#141414) calc(var(--lit) * 100%),#141414);
  background:var(--cream);border:max(1px,1.3cqi) solid var(--ink);border-radius:.9cqi 2.4cqi 2.4cqi .9cqi;}
.cv-b{flex:none;display:flex;align-items:center;justify-content:center;background:var(--band);}
.cv-top{height:26%;border-bottom:max(1px,1.1cqi) solid var(--ink);}
.cv-bot{height:24%;border-top:max(1px,1.1cqi) solid var(--ink);color:var(--band);}
.cv-bot svg{width:27cqi;height:27cqi;display:block;}
.cv-plate{display:block;width:24cqi;height:10.5cqi;border-radius:50%/48%;background:var(--cream);box-shadow:inset 0 0 0 max(.5px,.55cqi) rgba(20,20,20,.18);}
.cv-m{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.2cqi;padding:3cqi 7cqi;overflow:hidden;
  background:radial-gradient(120% 90% at 30% 20%,rgba(255,255,255,.45),transparent 60%);}
.cv-t{font-family:'Gill Sans','Gill Sans MT',Cabin,'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.02em;
  font-size:calc(var(--ts) * 1cqi);line-height:1.14;color:var(--ink);text-wrap:balance;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--tl);overflow:hidden;overflow-wrap:anywhere;}
.cv-rule{display:block;flex:none;width:16cqi;height:max(1px,1.5cqi);border-radius:1cqi;background:var(--band);}
.cv-a{font-family:'IBM Plex Mono',monospace;font-size:calc(var(--as) * 1cqi);letter-spacing:.08em;text-transform:uppercase;line-height:1.3;color:rgba(20,20,20,.72);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--al);overflow:hidden;text-wrap:balance;}
/* paper: a soft hinge shadow + highlight down the spine edge, and a sheen that follows the pointer (--mx) */
.cv-fx{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.20) 0,rgba(0,0,0,.04) 2.4cqi,rgba(255,255,255,.16) 3.4cqi,transparent 6.5cqi),
    linear-gradient(105deg,transparent calc(var(--mx,-40%) - 22%),rgba(255,255,255,.22) var(--mx,-40%),transparent calc(var(--mx,-40%) + 22%));}
@container (max-width:74px){.cv-a,.cv-rule{display:none;}.cv-m{padding:2cqi 4cqi;}}
/* tilt: JS (P._tilt) writes --rx/--ry/--mx on [data-tilt] hosts under a fine pointer */
[data-tilt] .cv{transform:perspective(700px) rotateX(calc(var(--rx,0) * 1deg)) rotateY(calc(var(--ry,0) * 1deg));transition:--lit .35s ease,transform .5s var(--ease-out);will-change:transform;}
[data-tilt].is-tilting .cv{transition:--lit .35s ease,transform .08s linear;}
@media (prefers-reduced-motion:reduce){.cv,[data-tilt] .cv{transition:none;transform:none;}}
/* ---------- route transitions (same-document View Transitions; see P._transition) ---------- */
.vt-hero .cv{view-transition-name:bj-cover;}
.vt-swap .vt-hero .cv{view-transition-name:none;}
.bj-hdr{view-transition-name:bj-header;}
::view-transition-old(root){animation:vtOut .16s var(--ease-out) both;}
::view-transition-new(root){animation:vtIn .34s var(--ease-out) both;}
::view-transition-group(bj-cover){animation-duration:.46s;animation-timing-function:var(--ease-out);z-index:50;}
::view-transition-old(bj-cover),::view-transition-new(bj-cover){animation-duration:.46s;}
.vt-cover::view-transition-new(root){animation-delay:.06s;}
@keyframes vtOut{to{opacity:0;}}
@keyframes vtIn{from{opacity:0;transform:translateY(8px);}}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none !important;}}
[data-hb] .cv{--lit:0;}
[data-hb]:hover .cv{--lit:1;}
/* Idle home-wall spotlight: JS sets data-pulse on one random cover every ~8s, replaying
   the hover state (genre colour + springy bounce) so the wall feels alive. A data attribute
   (not a class) is used because React manages the cover's className via style-hover — it would
   clobber an added class on re-render, but never touches an unknown data-* attribute. */
/* Three diminishing up-hops with a left-right + rotate shake (plays on the inner, whose base
   transform is none, so translate/scale/rotate compose cleanly). */
@keyframes bjWallPulse{
  0%  {transform:translate(0,0) scale(1) rotate(0);}
  12% {transform:translate(-3px,-11px) scale(1.12) rotate(-2.5deg);}
  24% {transform:translate(3px,0)     scale(1)    rotate(1.5deg);}
  40% {transform:translate(-2px,-8px) scale(1.08) rotate(-2deg);}
  54% {transform:translate(2px,0)     scale(1)    rotate(1.2deg);}
  70% {transform:translate(-1px,-5px) scale(1.05) rotate(-1deg);}
  84% {transform:translate(1px,0)     scale(1)    rotate(.5deg);}
  100%{transform:translate(0,0)       scale(1)    rotate(0);}
}
[data-pulse]{z-index:80;}
[data-pulse] [data-hb]{animation:bjWallPulse 1.6s cubic-bezier(.3,1.5,.5,1);}
[data-pulse] [data-hb] .cv{--lit:1;}
@media (prefers-reduced-motion:reduce){[data-pulse] [data-hb]{animation:none;}}
/* Shuffle motion is a JS-driven FLIP (see componentDidUpdate in app.js) — no CSS animation here. */
button{color:inherit;}
</style>
<style>
/* About page — the "open book" that shows what a mention is (scoped .ob-*).
   A real two-page opening of Kafka on the Shore where three other books are named;
   each highlighted title is a live link (a "door") to that book's own page. The
   procedural covers mirror app.js's triCover tri-band look — there are no image assets. */
.ob{margin:24px 0 6px;}
.ob-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);text-align:center;margin-bottom:18px;}
.ob-stage{position:relative;}
/* the open book: two facing pages sharing a gutter */
.ob-book{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;max-width:544px;margin:0 auto;background:var(--card);border:1.5px solid var(--ink);border-radius:5px;box-shadow:0 4px 0 rgba(20,20,20,.9);overflow:hidden;}
.ob-page{padding:20px 18px 24px;position:relative;}
.ob-page.l{border-right:1px solid rgba(20,20,20,.16);background:linear-gradient(270deg,rgba(20,20,20,.06),transparent 26px);}
.ob-page.r{background:linear-gradient(90deg,rgba(20,20,20,.06),transparent 26px);}
.ob-run{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:7.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);margin-bottom:14px;}
.ob-prose{font-family:'Instrument Serif',serif;font-size:17px;line-height:1.52;color:var(--ink);text-wrap:pretty;margin:0 0 7px;}
.ob-prose:last-child{margin-bottom:0;}
/* the highlight = a marker wash under the title; the title itself is a door */
a.ob-mk{color:var(--ink);text-decoration:none;font-style:italic;background-image:linear-gradient(transparent 58%,rgba(156,61,34,.30) 0);background-repeat:no-repeat;background-size:100% 100%;padding:0 1.5px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:color .2s ease,background-image .2s ease;}
a.ob-mk:hover{color:var(--accent);background-image:linear-gradient(rgba(156,61,34,.30),rgba(156,61,34,.30));}
/* connector down from the pages to the doors they open */
.ob-link{width:1.5px;height:26px;background:var(--ink);opacity:.85;margin:0 auto;}
.ob-doors-lbl{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:3px 0 14px;}
.ob-doors{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;}
a.ob-door{display:flex;flex-direction:column;align-items:center;gap:7px;width:76px;text-decoration:none;color:var(--ink);}
a.ob-door .ob-cv{width:100%;transition:transform .18s ease;}
a.ob-door:hover .ob-cv{transform:translateY(-4px);}
.ob-door-t{font-family:'Instrument Serif',serif;font-size:13px;line-height:1.14;text-align:center;}
.ob-door-a{font-family:'IBM Plex Mono',monospace;font-size:7.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);text-align:center;}
.ob-cap{max-width:440px;margin:22px auto 0;text-align:center;font-size:14.5px;line-height:1.6;color:var(--mut);text-wrap:pretty;}
.ob-attr{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;color:var(--mut);margin-top:12px;}
/* procedural tri-band cover (mirrors app.js triCover): band / cream blob / title / author / band */
.ob-cv{display:flex;flex-direction:column;aspect-ratio:2/3;background:#f2ecdd;border:1.5px solid var(--ink);overflow:hidden;box-sizing:border-box;}
.ob-cv-b{background:var(--band,#c4682e);height:26%;flex:none;display:flex;align-items:center;justify-content:center;border-bottom:1.5px solid var(--ink);}
.ob-cv-b.bot{height:24%;border-bottom:none;border-top:1.5px solid var(--ink);}
.ob-cv-blob{width:40%;height:42%;background:#f2ecdd;border-radius:50% / 48%;}
.ob-cv-m{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px 4px;overflow:hidden;text-align:center;}
.ob-cv-t{font-family:Helvetica,Arial,sans-serif;font-weight:700;text-transform:uppercase;font-size:7px;line-height:1.12;color:var(--ink);}
.ob-cv-a{font-family:'IBM Plex Mono',monospace;font-size:5px;letter-spacing:.04em;text-transform:uppercase;opacity:.7;color:var(--ink);}
@media (max-width:560px){
  .ob-book{grid-template-columns:1fr;max-width:100%;}
  .ob-page.l{border-right:none;border-bottom:1px solid rgba(20,20,20,.16);background:none;}
  .ob-page.r{background:none;}
}
@media (prefers-reduced-motion:reduce){
  a.ob-mk,a.ob-door .ob-cv{transition:none;}
}
</style>
<style>
/* ---------- Interactive home walls (?home=a|b|c) — engine in home.js ----------
   .hx is a fixed, app-like canvas: the wall (stage) scrolls/drags, the hero stays put.
   Engine-driven flags are data-* attributes (React never clobbers them); React owns the classes. */
.hx{position:fixed;inset:0;overflow:hidden;background:var(--wall);--wall:#ede6d6;--wall-rgb:237,230,214;--grid-rgb:62,96,130;--shade-rgb:90,70,40;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
.hx-stage{position:absolute;inset:0;cursor:grab;}
.hx[data-drag] .hx-stage{cursor:grabbing;}
.hw-layer{position:absolute;inset:0;}
/* backdrop: graph paper (far) + doodles (near), each oversized by one tile and translated by home.js */
.hw-bg{position:absolute;left:0;top:0;right:-520px;bottom:-520px;pointer-events:none;will-change:transform;}
.hw-grid{right:-160px;bottom:-160px;
  background-image:linear-gradient(rgba(var(--grid-rgb),.16) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--grid-rgb),.16) 1px,transparent 1px),
    linear-gradient(rgba(var(--grid-rgb),.07) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--grid-rgb),.07) 1px,transparent 1px);
  background-size:160px 160px,160px 160px,32px 32px,32px 32px;}
.hw-doodles{right:-420px;bottom:-420px;background-size:420px 420px;}
/* depth: a soft tray shadow at the edges so the paper reads as a surface the covers sit above */
.hx-stage::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;box-shadow:inset 0 0 120px rgba(var(--shade-rgb),.22);}
.hw-slot{position:absolute;left:0;top:0;width:var(--cw);will-change:transform;--lit:0;}
.hw-slot .cv{transition:none;}
.hw-card{border-radius:3px;box-shadow:0 0 0 1px rgba(242,236,221,.16),0 12px 26px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.3);transition:transform .32s var(--ease-spring),box-shadow .3s var(--ease-out);cursor:pointer;}
.hw-slot.is-hot{z-index:4;}
.hw-slot.is-hot .hw-card{transform:translateY(-8px) scale(1.07);box-shadow:0 0 0 1px rgba(242,236,221,.2),0 26px 44px rgba(0,0,0,.55),0 4px 8px rgba(0,0,0,.3);}
.hw-reseed .hw-layer{animation:hwReseed .5s var(--ease-out);}
@keyframes hwReseed{0%{opacity:.35;filter:blur(2px);}100%{opacity:1;filter:none;}}
.hw-arcs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3;}
.hw-arcs path{fill:none;stroke:#f2ecdd;stroke-width:1.6;stroke-dasharray:2 5;stroke-linecap:round;opacity:.85;}
.hw-arcs circle{fill:#f2ecdd;}
.hw-label{position:absolute;left:14px;top:0;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#f2ecdd;background:rgba(29,27,24,.9);padding:4px 10px;border-radius:999px;border:1px solid rgba(242,236,221,.25);white-space:nowrap;z-index:5;pointer-events:none;}
.hx-vignette{display:none;}
.hx.is-compact .hx-vignette{opacity:0;}
.hx-c .hx-vignette{display:none;}
.hx-c .hx-card{box-shadow:0 0 0 6px var(--wall),0 30px 60px rgba(0,0,0,.5);}
/* default: ink covers on graph paper. ?wall=dark — the charcoal wall with cream doodles */
.hx:not(.wall-dark) .hw-card{box-shadow:0 14px 26px rgba(70,50,25,.24),0 2px 5px rgba(40,30,15,.22);}
.hx:not(.wall-dark) .hw-slot.is-hot .hw-card{box-shadow:0 28px 46px rgba(70,50,25,.32),0 4px 8px rgba(40,30,15,.2);}
.hx:not(.wall-dark) .hw-arcs path{stroke:var(--accent);opacity:.9;}
.hx:not(.wall-dark) .hw-arcs circle{fill:var(--accent);}
.hx.wall-dark{--wall:#2e2a25;--wall-rgb:46,42,37;--grid-rgb:242,236,221;--shade-rgb:0,0,0;}
.hx.wall-dark .hw-grid{opacity:.55;}

/* hero card (A/B): centred; compacts to a slim search bar once you start moving the wall */
.hx-hero{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 28px));z-index:6;pointer-events:none;
  transition:top .6s var(--ease-out),transform .6s var(--ease-out),width .6s var(--ease-out);}
.hx-card{pointer-events:auto;background:var(--card);border:1.5px solid var(--ink);border-radius:22px;box-shadow:0 4px 0 rgba(20,20,20,.9),0 18px 36px rgba(40,30,15,.22);
  padding:clamp(22px,4vw,40px) clamp(18px,5vw,48px) clamp(20px,3.6vw,34px);text-align:center;box-sizing:border-box;transition:padding .6s var(--ease-out),border-radius .6s var(--ease-out);}
.hx-x{display:grid;grid-template-rows:1fr;transition:grid-template-rows .55s var(--ease-out),opacity .35s ease,margin .55s var(--ease-out);}
.hx-x > div{min-height:0;overflow:hidden;}
.hx-arc{display:flex;justify-content:center;max-width:420px;margin:0 auto;}
.hx-h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,6.4vw,52px);line-height:1.04;margin:14px 0 10px;letter-spacing:-.005em;}
.hx-p{font-size:15px;line-height:1.55;color:rgba(20,20,20,.72);max-width:440px;margin:0 auto;text-wrap:pretty;}
.hx-bar{display:flex;align-items:center;gap:8px;margin-top:22px;transition:margin .55s var(--ease-out);}
.hx-logo{flex:none;display:flex;align-items:center;gap:8px;width:0;opacity:0;overflow:hidden;padding:0;border:none;background:none;cursor:pointer;transition:width .55s var(--ease-out),opacity .3s ease;color:var(--ink);}
.hx-logo span{font-family:'Instrument Serif',serif;font-size:21px;white-space:nowrap;}
.hx-search{position:relative;flex:1;min-width:0;}
/* search suggestions (header, classic home, walls): mini cover + title/author + counts; keyboard nav */
.sg-pop{transition:opacity .18s var(--ease-out),transform .18s var(--ease-out);}
@starting-style{.sg-pop{opacity:0;transform:translateY(-6px);}}
.hx-b.is-compact:not(.is-typing) .sg-pop{transform-origin:bottom;}
.sg-pop button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:8px 16px;border-bottom:1px solid rgba(20,20,20,.08);color:var(--ink);font-family:inherit;}
.sg-pop button:last-child{border-bottom:none;}
.sg-pop button.on,.sg-pop button:hover{background:var(--ink);color:var(--paper);}
.sg-pop button.on .a,.sg-pop button:hover .a{color:rgba(247,245,240,.7);}
.sg-cv{flex:none;width:26px;}
.sg-t{flex:1;min-width:0;display:flex;flex-direction:column;}
.sg-pop .t{font-family:'Instrument Serif',serif;font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sg-pop .a{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.sg-pop .s{font-family:'IBM Plex Mono',monospace;font-size:10px;opacity:.6;white-space:nowrap;flex:none;}
@media (max-width:639px){.sg-pop .s{display:none;}}
/* auto-hiding sticky header (scroll down hides, scroll up reveals) */
.bj-hdr{transition:transform .3s var(--ease-out);}
.bj-hdr.hdr-hide{transform:translateY(-100%);}
.hx-search input{width:100%;height:54px;border:1.5px solid var(--ink);border-radius:999px;padding:0 54px 0 24px;font-size:16px;background:var(--paper);color:var(--ink);font-family:inherit;box-sizing:border-box;box-shadow:0 4px 0 rgba(20,20,20,.9);transition:height .55s var(--ease-out),box-shadow .3s;-webkit-user-select:text;user-select:text;}
.hx-shuf{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:999px;border:1.5px solid transparent;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.55;color:var(--ink);transition:opacity .2s,border-color .2s,transform .4s var(--ease-spring);}
.hx-shuf:hover{opacity:1;border-color:var(--ink);}
.hx-shuf:active{transform:translateY(-50%) rotate(180deg);}
.hx-sugg{position:absolute;top:calc(100% + 10px);left:0;right:0;background:var(--card);border:1.5px solid var(--ink);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.35);overflow:hidden;z-index:20;text-align:left;}
.hx-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:16px;}

.bj-constellation .chip .strong .sn{font-family:'Instrument Serif',serif;font-style:italic;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bj-constellation .chip .btns{display:flex;gap:8px;margin-top:13px;}
.bj-constellation .chip .btns button{padding:8px 12px;border:1.5px solid var(--ink);border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;cursor:pointer;white-space:nowrap;}

.bj-constellation .panel .head .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}

.bj-constellation .panel .head .syn{font-family:'Instrument Serif',serif;font-style:italic;font-size:14px;line-height:1.5;opacity:.8;margin-top:10px;}
.bj-constellation .panel .body{flex:1;overflow-y:auto;min-height:0;padding:6px 0;}

@keyframes cstlFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.bj-constellation.is-mobile #hint{display:none;}

  <sc-if value="{{ pgAbout }}" hint-placeholder-val="{{ false }}">
    <div data-screen-label="About" style="max-width:660px;margin:0 auto;{{ pagePad }}">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);">About</div>
      <h1 style="font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,6vw,46px);margin:10px 0 18px;">Books talk about books.</h1>
      <p style="font-size:16px;line-height:1.7;text-wrap:pretty;">A character picks a paperback off a shelf. A narrator quotes a novel they loved at fifteen. A biography lists what its subject read on a long voyage. BookJumpr collects those moments — <strong>explicit mentions of one book inside another</strong> — and turns them into a network you can wander.</p>
      <h2 style="font-family:'Instrument Serif',serif;font-weight:400;font-size:26px;margin:34px 0 10px;">How this site came to be</h2>
      <p style="font-size:16px;line-height:1.7;text-wrap:pretty;">I was reading <em>Kafka on the Shore</em> when I started noticing how the characters would mention other books, either as a reference point in their conversation, or that they read it, or alluding to it explicitly. Those titles began to leak into my own list.</p>
      <p style="font-size:16px;line-height:1.7;text-wrap:pretty;">Then another thought came to mind: would I understand and connect with this character or book better if I had read this book he mentioned beforehand? Although it isn't <em>necessary</em> but it made me think that the author made a deliberate choice to have the character reference the specific book.</p>
      <p style="font-size:16px;line-height:1.7;text-wrap:pretty;">BookJumpr grew out of these thoughts. Since then I&rsquo;ve kept a record of books mentioned in the main text of other books, across fiction and non-fiction. For this site, I also extract these mentions to populate the data set and graph.</p>

      <h2 style="font-family:'Instrument Serif',serif;font-weight:400;font-size:26px;margin:44px 0 10px;">What counts as a mention</h2>
      <p style="font-size:16px;line-height:1.7;text-wrap:pretty;">A book has to be named on the page: read, quoted, discussed, or dropped into conversation. Footnotes, bibliographies, and back-of-book references don&rsquo;t count. Neither do allusions a critic might spot — if the text doesn&rsquo;t say the title, it&rsquo;s not in.</p>

      <!-- The open book: one real two-page opening of Kafka on the Shore. Three other
           books are named across the spread; each highlighted title links to its own page. -->
      <figure class="ob">
        <div class="ob-eyebrow">What a mention looks like</div>
        <div class="ob-stage">
          <div class="ob-book">
            <div class="ob-page l">
              <div class="ob-run"><span>Kafka on the Shore</span><span>page ###</span></div>
              <p class="ob-prose">Finally I decide on a multivolume set, with beautiful covers, of the Burton translation of <a class="ob-mk" href="#/anonymous/a-thousand-and-one-nights">The Arabian Nights</a>, pick out one volume, and take it back to the reading room. I&rsquo;ve been meaning to read this book.</p>
            </div>
            <div class="ob-page r">
              <div class="ob-run"><span>###</span><span>Kafka on the Shore</span></div>
              <p class="ob-prose">&ldquo;Which of his novels have you read since you came here?&rdquo;</p>
              <p class="ob-prose">&ldquo;I finished <a class="ob-mk" href="#/natsume-soseki/the-miner">The Miner</a>, and now I&rsquo;m on <a class="ob-mk" href="#/natsume-soseki/poppies">Poppies</a>.&rdquo;</p>
              <p class="ob-prose">&ldquo;<em>The Miner</em>, huh?&rdquo; Oshima says.</p>
            </div>
          </div>
        </div>
        <div class="ob-link"></div>
        <div class="ob-doors-lbl">Named on these pages ↓</div>
        <div class="ob-doors">
          <a class="ob-door" href="#/anonymous/a-thousand-and-one-nights">
            <span class="ob-cv" style="--band:#c4682e;">
              <span class="ob-cv-b"><span class="ob-cv-blob"></span></span>
              <span class="ob-cv-m"><span class="ob-cv-t">A Thousand and One Nights</span><span class="ob-cv-a">Anonymous</span></span>
              <span class="ob-cv-b bot"></span>
            </span>
            <span class="ob-door-t">A Thousand and One Nights</span>
            <span class="ob-door-a">Anonymous</span>
          </a>
          <a class="ob-door" href="#/natsume-soseki/the-miner">
            <span class="ob-cv" style="--band:#c4682e;">
              <span class="ob-cv-b"><span class="ob-cv-blob"></span></span>
              <span class="ob-cv-m"><span class="ob-cv-t">The Miner</span><span class="ob-cv-a">Natsume S&#333;seki</span></span>
              <span class="ob-cv-b bot"></span>
            </span>
            <span class="ob-door-t">The Miner</span>
            <span class="ob-door-a">Natsume S&#333;seki</span>
          </a>
          <a class="ob-door" href="#/natsume-soseki/poppies">
            <span class="ob-cv" style="--band:#c4682e;">
              <span class="ob-cv-b"><span class="ob-cv-blob"></span></span>

              <span class="ob-cv-b bot"></span>
            </span>
            <span class="ob-door-t">Poppies</span>
            <span class="ob-door-a">Natsume S&#333;seki</span>

  <sc-if value="{{ showFooter }}" hint-placeholder-val="{{ false }}">
