# Netlify deploy config for BookJumpr.
# The whole repo stays in git, but only the static site files are PUBLISHED:
# the build step copies them into _site/ and Netlify serves that directory —
# so bookjumpr.db, tools/, data/, docs/ etc. are versioned but never served.
[build]
  command = "rm -rf _site && mkdir -p _site && cp index.html app.js home.js stories.js bookjumpr-data.js bookjumpr-notes.js constellation-view.js constellation-data.js explorer.js network-regions.js atlas.js atlas-data.js stars-data.js layouts-data.js favicon.svg social-preview.png apple-touch-icon.png icon-192.png icon-512.png manifest.json robots.txt sitemap.xml llms.txt llms-full.txt _site/ && cp -R vendor og _site/"
  publish = "_site"

# The data pipeline's dev dependency (unpdf) isn't needed to serve the site.
[build.environment]
  NETLIFY_USE_YARN = "false"
  NPM_FLAGS = "--no-save"

# Every path that isn't a file is the app: /<author>/<title>, /<author>, /about, … all load index.html, and the
# app routes from the path. The edge function (netlify/edge-functions/seo.js) runs first and gives each page its
# own title, description, canonical URL, crawler text and status.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers: basic hardening on every response. Caching stays Netlify's default (revalidate every visit, so a deploy
# shows up at once), except images, which rarely change and are cache-busted with ?v= when they do.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
